name: Quality Checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  # The release runs the same checks on the tag and publishes only when they pass.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch makes the run in progress useless. A release is never cancelled.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    name: Lint (Pint) and guards

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      # A dd() or a write to /tmp left in a validation path is something a host pays for.
      - name: No debugging leftovers
        run: composer check:debug

      # The package is written in English: its comments and its pages carry no Italian.
      - name: Language
        run: composer check:language

      # Every public class is named by at least one page: a refactoring that adds ten services
      # and documents none of them fails here instead of misleading a host.
      - name: Documentation coverage
        run: composer check:docs

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    name: Static Analysis (PHPStan)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    name: Docs (VitePress build)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A missing/broken doc page breaks the PR build, not the release.
      - name: Build docs
        run: npm run docs:build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12']
        include:
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'

    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      # Laravel 11 is out of security support: Packagist flags every one of its releases and
      # Composer refuses to resolve a flagged package. The CI only builds the package to test it
      # against the version it still declares, it serves nothing, so the blocking is turned off
      # for that leg and for no other.
      - name: Allow the advisories of Laravel 11
        if: matrix.laravel == '11'
        run: echo "COMPOSER_NO_SECURITY_BLOCKING=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
