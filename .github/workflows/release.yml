name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changelog for current version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # The section is matched as text, not as a pattern: a version is full of dots.
          awk -v version="[$VERSION]" 'index($0, version) { found=1; next } /^## / { found=0 } found' CHANGELOG.md > /tmp/changelog.txt
          {
            echo 'CONTENT<<EOF'
            cat /tmp/changelog.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        env:
          # The notes travel as data, never inside the script: a changelog is full of backticks.
          RELEASE_NOTES: ${{ steps.changelog.outputs.CONTENT }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: process.env.RELEASE_NOTES,
            });

      - name: Trigger Packagist update
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -sS -X POST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/robyconte/filament-flow"}}'
